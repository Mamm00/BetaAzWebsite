name: CI

# Build + validate the Astro site. The deployable static files (root index.html
# + assets) are committed to `main` and served by GitHub Pages' legacy builder
# (source: branch main, path /). No deploy-pages action is used, so there are
# no Pages-source errors. Rebuild + re-commit the built files to root when
# content changes (see AGENT_STATE.md).

on:
  push:
    branches: [main, arena/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync Astro types
        run: npx astro sync

      - name: Validate content
        run: npm run validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (base = GitHub Pages subpath)
        run: AZT_BASE=/BetaAzWebsite/ npm run build

      - name: Verify root index.html emitted
        run: test -f dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
