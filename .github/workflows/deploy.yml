name: Deploy — dual host

# Deploy to GitHub Pages with custom domain (§28).
# Builds with AZT_BASE=/ so internal links are root-relative and work at
# the custom domain alazhartex.com. The CNAME file (alazhartex.com) is kept
# so GitHub Pages serves the site at the custom domain root.

on:
  push:
    branches: [main, arena/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync Astro types
        run: npx astro sync

      - name: Validate content
        run: npm run validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (AZT_BASE=/)
        run: AZT_BASE=/ npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
